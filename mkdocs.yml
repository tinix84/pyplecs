site_name: PyPLECS
site_description: Python automation framework for PLECS power electronics simulation
site_url: https://tinix84.github.io/pyplecs/
repo_url: https://github.com/tinix84/pyplecs
repo_name: tinix84/pyplecs

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ['.']
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Story Map: story-map.md
  - Decisions:
    - Index: adr/README.md
    - ADR-0001 Circuit Model seam: adr/0001-circuit-model-is-the-single-interchange-seam.md
    - ADR-0002 Cache Record identity: adr/0002-cache-record-identity-is-owned-by-the-topology-key-map.md
    - ADR-0003 Promotable contracts: adr/0003-only-contracts-are-promotable-to-pycircuitsim-core.md
    - ADR-0004 Code is the architecture: adr/0004-code-is-the-only-architecture-truth.md
    - ADR-0005 Thin execution engine: adr/0005-pyplecs-is-a-thin-execution-engine.md
    - ADR-0006 Two model flavors: adr/0006-two-model-flavors-no-merge.md
    - ADR-0007 Verbatim tables: adr/0007-verbatim-tables-rewritten-prose.md
    - ADR-0008 uv owns dependencies: adr/0008-pyproject-and-uv-own-dependencies.md
  - Research: research/README.md
  - Agents:
    - Domain docs: agents/domain.md
    - Issue tracker: agents/issue-tracker.md
    - Triage labels: agents/triage-labels.md
