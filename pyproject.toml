[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyplecs"
version = "1.0.0"
description = "Advanced PLECS simulation automation with web UI and API"
readme = "README.md"
authors = [ { name = "riccardo tinivella", email = "tinix84@gmail.com" }]
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "pyarrow",
    "pyyaml",
    "pydantic>=2.0",
    "structlog>=21.1.0",
    "click>=8.0.0",
    "python-dotenv>=0.19.0",
    "packaging>=21.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.68.0",
    "uvicorn[standard]>=0.15.0",
    "jinja2>=3.0.0",
    "aiofiles>=0.7.0",
    "websockets>=10.0",
    "python-multipart>=0.0.5",
    "plotly>=5.0.0",
    "rich>=10.0.0",
    "tqdm>=4.62.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
]
gui = [
    "pywinauto>=0.6.8",
    "psutil>=5.8.0",
    "colorama>=0.4.4",
]
# Alternative cache backends. Parquet (pyarrow) is a core dependency because
# pyplecs/__init__.py imports .cache unguarded and it is the default format.
cache = [
    "h5py>=3.3.0",
    "diskcache>=5.4.0",
    "redis>=4.0.0",
]
# Dependencies for pyplecs/optimizer, which ADR-0005 makes a placeholder that
# will not be built. Declared so the historical intent is not lost; nothing
# imports them.
opt = [
    "scikit-optimize>=0.9.0",
    "optuna>=2.10.0",
    "deap>=1.3.1",
    "scikit-learn>=1.0.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
]
mcp = ["mcp>=1.0"]
dev = [
    "beautifulsoup4>=4.12",
    "httpx>=0.25",
    "mcp>=1.0",
    "pytest",
    "pytest-asyncio>=0.15.0",
    "pytest-cov>=2.12.0",
    "ruff",
    "vulture>=2.7",
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "pymdown-extensions>=10.0",
]

[tool.setuptools.packages.find]
include = ["pyplecs*"]

[project.scripts]
pyplecs-api = "pyplecs.api:main"
pyplecs-setup = "pyplecs.cli.installer:main"
pyplecs-gui = "pyplecs.webgui:run_app"
pyplecs-mcp = "pyplecs.mcp:main"
pyplecs-convert = "pyplecs.converter.cli:main"
pyplecs-mcp-sim = "pyplecs.mcp.simulation_server:main"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F841"]

[tool.pytest.ini_options]
# Live checks talk to a licensed PLECS and are opt-in (ADR-0013):
#   uv run pytest -m live_plecs
#   uv run pytest -m converter_acceptance
addopts = "-m 'not live_plecs and not converter_acceptance'"
markers = [
    "live_plecs: needs the configured PLECS XML-RPC endpoint; skips with the endpoint in the reason when unreachable",
    "converter_acceptance: semi-manual converter acceptance pack; needs a SPICE export and fails naming the missing evidence",
]
